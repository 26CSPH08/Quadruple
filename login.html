<!DOCTYPE html>
<html>
<head>
<title>Login - My Book Store</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Della+Respira&family=Great+Vibes&display=swap');
body{
  margin:0;
  font-family: "Della Respira", serif;
  background-color: #6A0F2C;
  background-image: repeating-linear-gradient(90deg,
    #6A0F2C 0px, #6A0F2C 98px,
    #1F2630 98px, #1F2630 100px,
    #6A0F2C 100px, #6A0F2C 198px,
    #007d7f 198px, #007d7f 200px,
    #6A0F2C 200px, #6A0F2C 298px,
    #4b3d3e 298px, #4b3d3e 300px
  );
  min-height: 100vh;
}
.topbar{
  display:flex;
  justify-content:center;
  gap:8px;
  padding:12px;
  background: #F4EFEA;
  flex-wrap: wrap;
}
.topbar button{
  width:auto;
  padding:6px 12px;
  margin:0;
  font-size:14px;
  font-family: "Della Respira", serif;
  background: #F4EFEA;
  color: #6A0F2C;
  border:1px solid #6A0F2C;
  border-radius:6px;
  cursor:pointer;
}
.topbar button:hover{
  background: #6A0F2C;
  color: #F4EFEA;
}
.container{
  background: #F4EFEA;
  width: 520px;
  padding: 28px;
  border-radius: 14px;
  border-top: 6px solid #6A0F2C;
  margin: 30px auto;
}
h2{
  text-align:center;
  color:#6A0F2C;
  margin:0 0 20px 0;
  font-size:34px;
}
label{
  display:block;
  font-size:22px;
  margin-top:12px;
  font-family: "Great Vibes", cursive;
  color: #4b3d3e;
}
input{
  display:block;
  width:100%;
  padding:12px 14px;
  margin:6px 0 16px 0;
  border-radius:7px;
  border:1px solid #6A0F2C;
  box-sizing:border-box;
  font-size:16px;
  font-family: "Della Respira", serif;
}
button.login{
  display:block;
  width:100%;
  padding:11px;
  background:#6A0F2C;
  color:#F4EFEA;
  border:none;
  border-radius:7px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}
button.login:hover{
  background:#0F6B6B;
}
</style>
</head>
<body>

<div class="topbar">
<button onclick="window.location.href='registration.html'">Registration Page</button>
<button onclick="window.location.href='login.html'">Login Page</button>
<button onclick="window.location.href='home.html'">Home</button>
<button onclick="window.location.href='about.html'">About</button>
<button onclick="window.location.href='cart.html'">My Cart</button>
<button onclick="window.location.href='contact.html'">Contact</button>
</div>

<div class="container">
<h2>Login</h2>

<label>Email</label>
<input type="text" id="email" placeholder="Enter your Gmail address">

<label>Password</label>
<input type="password" id="password" placeholder="Enter your password">

<button class="login" onclick="login()">Login</button>
</div>
<script>
function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  if (email === "" || password === "") {
    alert("Kindly enter email, password");
    return;
  }

  if (!email.endsWith("@gmail.com")) {
    alert("Kindly enter a valid email address with @gmail.com");
    return;
  }

  if (password.length < 6) {
    alert("Kindly enter a valid password with minimum 6 characters");
    return;
  }

  fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  }).then(res => res.json()).then(data => {
    if (data.success) {
      alert("Logged in successfully");
      window.location.href = 'home.html';
    } else {
      alert("Invalid email or password");
    }
  }).catch(err => {
    alert("Server error: " + err);
  });
}
</script>
</body>
</html>
